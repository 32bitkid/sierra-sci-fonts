<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'SciAC FONT.000';
      src: url('./sciAC-font-000.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'SciPX FONT.000';
      src: url('./sciPX-font-000.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'SciAC FONT.000 Free';
      src: url('./sciAC-font-000-free.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'SciPX FONT.000 Free';
      src: url('./sciPX-font-000-free.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --test-size: calc(16px * 2);
    }

    :root, :root body {
      margin: 0;
      padding: 0;
    }

    figure {
      box-sizing: border-box;
      border: 1px solid rgb(0 0 0 / 0.10);
      box-shadow: 0.5rem 0.5rem 0.5rem rgb(0 0 0 / 0.10);
      border-radius: 0.5rem;
      padding: 1rem;
      caption-side: top;
    }

    .no-anti-aliasing {
      -webkit-font-smoothing: none;
      font-smooth: none;
    }

    figure.sci figcaption {
      font-family: monospace;
      margin-block: 0.5rlh;
    }

    .sci p {
      margin-block: 0 1lh;
    }

    .sci.px p {
      -webkit-font-smoothing: none;
      font-smooth: none;
    }

    .sci.ac.font-000 p {
      font-family: "SciAC FONT.000", sans-serif;
      font-size: var(--test-size);
    }

    .sci.px.font-000 p {
      font-family: "SciPX FONT.000", sans-serif;
      font-size: var(--test-size);
    }

    .sci.ac.font-000-free p {
      font-family: "SciAC FONT.000 Free", sans-serif;
      font-size: var(--test-size);
    }

    .sci.px.font-000-free p {
      font-family: "SciPX FONT.000 Free", sans-serif;
      font-size: var(--test-size);
    }
  </style>
</head>
<body>
  <figure class="sci ac font-000">
    <figcaption>SciAC FONT.000</figcaption>
    <p>The five boxing wizards jump quickly.</p>
    <p>25¢ each, or 5 for $1.00.</p>
    <p lang="fr">Les naïfs ægithales hâtifs d'Aÿ pondant à Noël où il gèle sont sûrs d'être déçus en voyant leurs drôles d'œufs abîmés</p>
    <p lang="de">Victor jagt zwölf Boxkämpfer quer über den großen Sylter Deich</p>
    <p lang="es">Benjamín pidió una bebida de kiwi y fresa. Noé, sin vergüenza, la más exquisita champaña del menú</p>
    <p lang="ga">D'ith cat mór dubh na héisc lofa go pras</p>
    <p lang="is">Kæmi ný öxi hér, ykist þjófum nú bæði víl og ádrepa</p>
  </figure>

  <figure class="sci px font-000">
    <figcaption>SciPX FONT.000</figcaption>
    <p>The five boxing wizards jump quickly.</p>
    <p>25¢ each, or 5 for $1.00.</p>
    <p lang="fr">Les naïfs ægithales hâtifs d'Aÿ pondant à Noël où il gèle sont sûrs d'être déçus en voyant leurs drôles d'œufs abîmés</p>
    <p lang="de">Victor jagt zwölf Boxkämpfer quer über den großen Sylter Deich</p>
    <p lang="es">Benjamín pidió una bebida de kiwi y fresa. Noé, sin vergüenza, la más exquisita champaña del menú</p>
    <p lang="ga">D'ith cat mór dubh na héisc lofa go pras</p>
    <p lang="is">Kæmi ný öxi hér, ykist þjófum nú bæði víl og ádrepa</p>
  </figure>

  <figure class="sci ac font-000-free">
    <figcaption>SciPX FONT.000 Free</figcaption>
    <p>The five boxing wizards jump quickly.</p>
    <p>$0.25 each, or 5 for $1.00.</p>
  </figure>

  <figure class="sci px font-000-free">
    <figcaption>SciPX FONT.000 Free</figcaption>
    <p>The five boxing wizards jump quickly.</p>
    <p>$0.25 each, or 5 for $1.00.</p>
  </figure>
</body>
</html>
